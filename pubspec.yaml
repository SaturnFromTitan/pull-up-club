name: pull_up_club
description: "The plan for doubling your max pull-ups!"
publish_to: "none"
version: 1.1.0

environment:
  sdk: 3.9.2
  flutter: 3.35.7

dependencies:
  audioplayers: ">=6.1.0"
  drift: ">=2.29.0"
  drift_flutter: ">=0.2.7"
  flutter:
    sdk: flutter
  logging: ">=1.3.0"
  package_info_plus: ">=8.0.0"
  path_provider: ">=2.1.5"
  provider: ">=6.1.5"
  sentry_flutter: ">=9.8.0"

dev_dependencies:
  build_runner: ">=2.9.0"
  drift_dev: ">=2.29.0"
  flutter_launcher_icons: ">=0.14.4"
  flutter_lints: ">=6.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 400
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 500
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  ios: true
  image_path_ios: assets/app_icon.png
  remove_alpha_ios: true
