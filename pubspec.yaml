name: pull_up_club
description: "The plan for doubling your max pull-ups!"
publish_to: "none"
version: 1.3.1

environment:
  sdk: 3.10.4
  flutter: 3.38.5

dependencies:
  audioplayers: ^6.7.1
  clock: ">=1.1.2"
  crypto: ">=3.0.0"
  drift: ^2.34.4
  drift_flutter: ">=0.2.7"
  flutter:
    sdk: flutter
  http: ">=1.2.0"
  logging: ">=1.3.0"
  lucide_icons_flutter: ">=3.1.8"
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  provider: ">=6.1.5"
  pub_semver: ^2.2.1
  sentry_flutter: ^9.30.1
  sign_in_with_apple: "<8.0.0"  # v8 is currently only available as pre-release
  supabase_flutter: ^2.18.0
  url_launcher: ">=6.3.1"
  uuid: ^4.6.0
  wakelock_plus: "^1.4.0"
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  build_runner: ">=2.9.0"
  drift_dev: ">=2.29.0"
  fake_async: ">=1.3.0"
  flutter_launcher_icons: ">=0.14.4"
  flutter_lints: ">=6.0.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 400
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 500
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  ios: true
  image_path_ios: assets/app_icon.png
  remove_alpha_ios: true
