name: Release to TestFlight

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-testflight
  cancel-in-progress: false

jobs:
  # ⚠️ we should also run the PR checks in this workflow to guard against race conditions when
  # multiple PRs are merged at the same time.
  # As long as its only me working on this repo, it suffices to run them only in the PR workflow.

  testflight:
    runs-on: macos-15
    # this workflow times our frequently. additional time doesn't seem to solve the issue though
    # if it succeeds, it uually does in <10 minutes. if it doesn't succeed by then, then it also
    # times out after 2 hours. :shrug:
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.2'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart pub run build_runner build

      - name: Generate iOS app icons
        run: |
          dart run flutter_launcher_icons
          ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true
          ruby-version: '3.3'
          working-directory: ios

      - name: Bundle install
        working-directory: ios
        run: bundle install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Generate Flutter iOS build configuration
        run: flutter build ios --release --no-codesign --config-only

      # `match` is run in read-only mode to fetch signing assets. See the README for more details.
      - name: Fastlane beta → TestFlight
        working-directory: ios
        env:
          APP_BUNDLE_ID: com.saturnfromtitan.pullupclub
          APP_STORE_CONNECT_KEY_ID: SMB27J9U63
          APP_STORE_CONNECT_ISSUER_ID: 22b3172d-3eba-4290-afb8-7dbb1961ce38
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: U8FWPQDZJJ
          MATCH_GIT_URL: https://x-access-token:${{ secrets.CERTS_TOKEN }}@github.com/SaturnFromTitan/pull-up-club-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta

      - name: Publish build info to summary
        if: always()
        run: |
          if [ -f build/build_info.env ]; then
            set -a
            . build/build_info.env
            set +a
            {
              echo "### Release Info"
              echo ""
              echo "- Marketing version: ${MARKETING_VERSION}"
              echo "- Build number: ${BUILD_NUMBER}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build info not found at build/build_info.env" >> "$GITHUB_STEP_SUMMARY"
          fi
