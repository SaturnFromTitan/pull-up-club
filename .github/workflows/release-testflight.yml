# CI runs `match` in read-only mode to fetch signing assets. See the README for more details.
name: Release to TestFlight

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: com.saturnfromtitan.pullupclub
      MATCH_GIT_URL: https://x-access-token:${{ secrets.CERTS_TOKEN }}@github.com/SaturnFromTitan/pull-up-club-certificates.git
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS app icons
        run: |
          dart run flutter_launcher_icons
          echo ok > ios/Runner/Assets.xcassets/AppIcon.appiconset/_write_test.txt
          ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset
          cat ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json

