name: Release to TestFlight

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    # this workflow times our frequently. additional time doesn't seem to solve the issue though
    # if it succeeds, it uually does in <10 minutes. if it doesn't succeed by then, then it also
    # times out after 2 hours. :shrug:
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build

      - name: Generate iOS app icons
        run: |
          dart run flutter_launcher_icons
          ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Bundle install
        working-directory: ios
        run: bundle install --path vendor/bundle

      # `match` is run in read-only mode to fetch signing assets. See the README for more details.
      - name: Fastlane beta → TestFlight
        working-directory: ios
        env:
          APP_BUNDLE_ID: com.saturnfromtitan.pullupclub
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ secrets.CERTS_TOKEN }}@github.com/SaturnFromTitan/pull-up-club-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta

      - name: Publish build info to summary
        if: always()
        run: |
          if [ -f build/build_info.env ]; then
            set -a
            . build/build_info.env
            set +a
            {
              echo "### Release Info"
              echo ""
              echo "- Marketing version: ${MARKETING_VERSION}"
              echo "- Build number: ${BUILD_NUMBER}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build info not found at build/build_info.env" >> "$GITHUB_STEP_SUMMARY"
          fi
