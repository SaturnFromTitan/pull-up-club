name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: Install pre-commit
      run: python3 -m pip install pre-commit

    - name: Run linters via pre-commit
      run: pre-commit run --all-files --show-diff-on-failure --color always

  test-unit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: Run unit tests
      run: flutter test test/

  test-integration:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: Launch iOS Simulator
      uses: futureware-tech/simulator-action@v4
      with:
        model: 'iPhone 16'
        wait_for_boot: true

    - name: List Flutter devices
      run: flutter devices

    - name: Run integration tests
      run: flutter test integration_test/ -d "iPhone 16" --dart-define=TEST_MODE=true

  check-privacy-date:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch full history to get commit dates

    - name: Check privacy policy date
      run: tools/update-privacy-date.sh
