name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: Install pre-commit
      run: python3 -m pip install pre-commit

    - name: Run linters via pre-commit
      run: pre-commit run --all-files --show-diff-on-failure --color always

  test-unit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: Run unit tests
      run: flutter test test/

  test-integration:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: flutter pub run build_runner build

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Find and boot iOS simulator
      id: simulator
      run: |
        # Find an available iPhone simulator
        # Try to find iPhone 15 first, then fallback to any iPhone
        SIMULATOR_NAME=""
        if xcrun simctl list devices available | grep -q "iPhone 15"; then
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
        else
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -i "iPhone" | grep -v "unavailable" | head -1 | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
        fi

        if [ -z "$SIMULATOR_NAME" ]; then
          echo "No iPhone simulator found, listing all devices:"
          xcrun simctl list devices
          exit 1
        fi
        echo "Found simulator: $SIMULATOR_NAME"
        echo "simulator_name=$SIMULATOR_NAME" >> $GITHUB_OUTPUT

        # Boot the simulator by name
        echo "Booting simulator: $SIMULATOR_NAME"
        xcrun simctl boot "$SIMULATOR_NAME" 2>/dev/null || true

        # Wait for simulator to be fully ready
        echo "Waiting for simulator to be ready..."
        timeout=60
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if xcrun simctl list devices | grep "$SIMULATOR_NAME" | grep -q "Booted"; then
            echo "Simulator is booted"
            break
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done

        if [ $elapsed -ge $timeout ]; then
          echo "Timeout waiting for simulator to boot"
          xcrun simctl list devices
          exit 1
        fi

        # Additional wait for simulator to be fully ready
        echo "Waiting additional 5 seconds for simulator to be fully ready..."
        sleep 5

    - name: List Flutter devices
      run: flutter devices

    - name: Run integration tests
      run: flutter test integration_test/ -d "${{ steps.simulator.outputs.simulator_name }}" --dart-define=TEST_MODE=true

  check-privacy-date:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch full history to get commit dates

    - name: Check privacy policy date
      run: tools/update-privacy-date.sh
