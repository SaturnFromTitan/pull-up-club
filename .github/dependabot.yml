version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dart-updates:
        patterns: ["*"]
