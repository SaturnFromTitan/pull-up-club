version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees:
      - SaturnFromTitan
    directory: "/"
    commit-message:
      prefix: "ci"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 3
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "pub"
    assignees:
      - SaturnFromTitan
    directory: "/"
    schedule:
      interval: quarterly
    # The >= constraints already allow newer releases; update the lockfile without rewriting them.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
    # Sentry 10 requires SwiftPM, which currently crashes in the TestFlight runner.
    ignore:
      - dependency-name: "sentry_flutter"
    groups:
      dart-updates:
        patterns: ["*"]
