version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 3
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: quarterly
    # The >= constraints already allow newer releases; update the lockfile without rewriting them.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
    groups:
      dart-updates:
        patterns: ["*"]
